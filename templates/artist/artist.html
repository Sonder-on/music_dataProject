<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐数据平台 - 艺人分析</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-wordcloud@2.1.0/dist/echarts-wordcloud.min.js"></script>

    <link rel="stylesheet" href="/static/components/navbar.css?v=1">
    <link rel="stylesheet" href="/static/artist/artist.css?v=1">
</head>
<body>

{% include 'components/navbar.html' %}

<div class="search-container">
    <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input"
               placeholder="输入艺人名称 " onkeypress="handleKeyPress(event)"
               autocomplete="off"/>
        <div id="searchSuggestions" class="search-suggestions"></div>
    </div>
    <button class="search-btn" onclick="performSearch()">检索艺人</button>
</div>

<div class="artist-overview-wrapper" id="artistOverviewWrapper">
    <div class="overview-header">
        <h2>🔥 巨星殿堂 (Top 10)</h2>
        <p>基于本地库的全球听众热度数据</p>
    </div>
    <div class="overview-content">
        <div class="top-artists-list" id="top10ArtistsContainer">
            <div style="color: #888; padding: 20px;">正在加载殿堂数据...</div>
        </div>
        <div class="genre-chart-container">
            <div id="genreChartOverview" style="width: 100%; min-height: 450px;"></div>
        </div>
    </div>
</div>

<div id="loader" style="display: none;">🎙️ 正在检索数据，请稍候...</div>

<div id="artistContent" style="display: none">
    <div class="panel artist-profile" style="display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 180px;">

        <div style="display: flex; align-items: center; gap: 30px; flex-shrink: 0;">
            <div class="artist-avatar" id="artistAvatar">A</div>
            <div class="artist-info">
                <div class="artist-badge">✓ 已认证艺人 (Verified Artist)</div>

                <div style="display: flex; align-items: center; margin-bottom: 12px;">
                    <div class="artist-name" id="artistName" style="margin-bottom: 0;">Artist Name</div>
                    <button id="favoriteBtn" class="favorite-btn" style="display: none; background: transparent; border: 1px solid #fff; color: #fff; padding: 6px 16px; border-radius: 20px; cursor: pointer; margin-left: 20px; font-size: 14px; font-weight: bold; transition: 0.3s;">
                        🤍 收藏
                    </button>
                </div>

                <div class="genres-container" id="genreTags">
                    <span class="genre-tag">Pop</span>
                </div>
                <div class="stat-item" style="margin-top: 15px;">
                    <span class="stat-label" style="display:block; font-size:12px; color:#888; margin-bottom:4px;">听众总数 (Listeners)</span>
                    <span class="stat-value" style="color:#1db954; font-size: 24px; font-weight: bold;" id="listenersCount">0</span>
                </div>
            </div>
        </div>

        <div id="artistTrendWrapper" style="display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center; height: 160px; padding: 0 20px;">
            <div style="font-size: 13px; color: #aaa; margin-bottom: 5px; font-weight: bold; letter-spacing: 1px;">📈 近期打榜最高排名走势</div>
            <div id="artistTrendChartMini" style="width: 100%; height: 100%; min-width: 250px; max-width: 450px;"></div>
        </div>

        <div style="width: 350px; height: 160px; position: relative; flex-shrink: 0;">
            <div style="position: absolute; top: -10px; right: 0; color: #666; font-size: 12px; font-weight: bold; z-index: 10;">风格流派 (Tags)</div>
            <div id="wordCloudChart" style="width: 100%; height: 100%;"></div>
        </div>

    </div>

    <div class="panel albums-panel" style="margin-top: 20px;">
        <div class="panel-title" style="margin-bottom: 15px;">发行的专辑与单曲 (Discography)</div>
        <div class="album-cards-container" id="artistAlbumsList"></div>
    </div>

    <div class="bottom-layout" style="display: flex; gap: 20px; margin-top: 20px; min-height: 500px; padding-bottom: 40px;">
        <div class="panel top-tracks-panel" style="flex: 1.2; display: flex; flex-direction: column;">
            <div class="panel-title">最热代表作 (Top Tracks)</div>
            <div class="list-scroll-area" id="topTracksList" style="flex: 1; overflow-y: auto;"></div>
        </div>

        <div class="charts-panel" style="flex: 1.5; display: flex; flex-direction: column;">
            <div class="panel chart-box" style="display: flex; flex-direction: column; flex: 1; min-height: 300px;">
                <div class="panel-title" style="font-size: 15px; margin-bottom: 10px;">热门歌曲播放量排行</div>
                <div id="trendChart" style="flex: 1; width: 100%;"></div>
            </div>
        </div>

        <div class="panel similar-panel" style="flex: 1.2; display: flex; flex-direction: column;">
            <div class="panel-title" style="font-size: 15px; margin-bottom: 10px;">相似音乐人推荐</div>
            <div id="similarGraphChart" style="flex: 1; width: 100%; min-height: 300px;"></div>
        </div>
    </div>
</div>

<script src="/static/components/navbar.js?v=1"></script>
<script src="/static/artist/artist.js?v=1"></script>
</body>
</html>
