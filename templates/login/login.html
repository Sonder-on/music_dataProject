<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐数据平台 - 系统登录</title>
    <link rel="stylesheet" href="../../static/login/login.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="brand-section">
            <div class="brand-header">
                <div class="brand-logo">
                    <span style="font-size: 32px; margin-right: 10px;">🎧</span>
                    <span>Music Analytics</span>
                </div>
                <h1>探索音乐数据的<br>无限可能。</h1>
            </div>
            <div class="brand-footer">
                &copy; 2026 Spotify Data Analytics. All rights reserved.
            </div>
        </div>

        <div class="form-section">
            <div class="form-title">登录至大盘控制台</div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label class="input-label" for="username">管理员账号</label>
                    <input type="text" id="username" class="input-field" placeholder="请输入您的账号 (例如: admin)" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label class="input-label" for="password">密码</label>
                    <input type="password" id="password" class="input-field" placeholder="请输入密码" required>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember">
                        <span class="custom-checkbox"></span>
                        记住我
                    </label>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">登 录</button>

            </form>

            <div class="register-hint">
                <hr>
                <p>还没有平台权限？</p>
                <a href="#">申请内测账号</a>
            </div>
        </div>
    </div>

    <script src="../../static/login/login.js"></script>
</body>
</html>
